<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caesar Cipher - Web Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Caesar Cipher Tool</h3>
                        <form method="POST">
                            <div class="mb-3">
                                <label for="text" class="form-label">Enter Text</label>
                                <textarea id="text" name="text" class="form-control" rows="3" required>{{ request.form.text or '' }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="shift" class="form-label">Shift Value</label>
                                <input type="number" id="shift" name="shift" class="form-control" min="1" required value="{{ request.form.shift or '' }}">
                            </div>
                            <div class="mb-3">
                                <label for="action" class="form-label">Choose Action</label>
                                <select id="action" name="action" class="form-select">
                                    <option value="encode" {% if request.form.action == "encode" %}selected{% endif %}>Encode (Encrypt)</option>
                                    <option value="decode" {% if request.form.action == "decode" %}selected{% endif %}>Decode (Decrypt)</option>
                                </select>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </form>

                        {% if result %}
                            <div class="alert alert-success mt-4 rounded-3 shadow-sm">
                                <strong>Result:</strong> {{ result }}
                            </div>
                        {% endif %}
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
